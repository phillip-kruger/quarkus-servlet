# Per-test timeout so that an unimplemented feature fails its test instead of hanging the whole
# TCK run. Several TCK clients block on a response that never arrives (HTTP trailers, the
# non-blocking I/O listeners).
#
# 150s rather than something tighter because a handful of tests are slow by design, not by defect:
# sessionTimeoutTest sets a 60 second session timeout and then sleeps 90 seconds inside the servlet
# to prove the session expired. Anything at or below 90s fails it on the clock while the extension
# is behaving correctly, which is worse than waiting - it reports a passing feature as broken.
#
# SEPARATE_THREAD is essential: the default SAME_THREAD mode only reports a timeout after the test
# returns, so it can never interrupt a thread blocked in a socket read - which is exactly the
# situation here.
junit.jupiter.execution.timeout.testable.method.default = 150 s
junit.jupiter.execution.timeout.lifecycle.method.default = 180 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
