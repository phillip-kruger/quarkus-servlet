# Per-test timeout so that an unimplemented feature fails its test instead of hanging the whole
# TCK run. Several TCK clients block on a response that never arrives (HTTP trailers, the
# non-blocking I/O listeners).
#
# SEPARATE_THREAD is essential: the default SAME_THREAD mode only reports a timeout after the test
# returns, so it can never interrupt a thread blocked in a socket read - which is exactly the
# situation here.
junit.jupiter.execution.timeout.testable.method.default = 60 s
junit.jupiter.execution.timeout.lifecycle.method.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
