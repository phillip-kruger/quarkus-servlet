
# Users for the declarative-security tests. BASIC is what web.xml's <login-config> asks for;
# which mechanism is active is build-time configuration the application owns, so it is set here
# rather than inferred by the extension.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.tester=tester
quarkus.security.users.embedded.roles.tester=tester
