# Per-test timeout so an unimplemented feature fails its test instead of hanging the whole run.
# SEPARATE_THREAD is essential: SAME_THREAD only reports a timeout after the test returns, so it
# can never interrupt a thread blocked in a socket read.
junit.jupiter.execution.timeout.testable.method.default = 60 s
junit.jupiter.execution.timeout.lifecycle.method.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
